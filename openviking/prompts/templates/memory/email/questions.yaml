memory_type: questions
description: |
  Unresolved questions owned by the subject their answer clarifies, independently of
  the email author. User aliases belong to self; a person's details belong to that
  person; project identity/goals/roles belong to an existing matter. Propose questions
  and evidence only. OV preserves authoritative answer and lifecycle history.
directory: "viking://user/{{ user_space }}/memories"
filename_template: "questions.md"
enabled: true
embedding_template: "{{ content }}"
fields:
  - name: subjectKind
    type: string
    description: "self, person, or matter. Choose whose identity or knowledge the answer clarifies."
    merge_op: replace
  - name: subjectId
    type: string
    description: "self for the user; stable person anchor ID for a person; existing matter filename stem for a matter."
    merge_op: replace
  - name: subjectMemoryUri
    type: string
    description: "Empty for self. Confirmed personMemoryUri for the current person. For another person/matter, the existing fully read memory URI. Never invent a subject."
    merge_op: replace
  - name: entries
    type: string
    description: |
      JSON array encoded as a string, maximum 20 proposed questions for this subject.
      Each proposal has topicKey (stable descriptive key scoped to subject and time),
      text (one natural question addressed to the user), sourceRefs (actual email:UUID
      evidence). Optional questionId must reference an existing question already read;
      retain it when rewording or moving subject. Optional relatedSubjectUris references
      other existing fully read subjects. Optional ownershipUncertain=true marks a
      provisional self question whose subject cannot yet be resolved. Reuse topicKey
      or questionId for the same uncertainty. No content field: OV renders the single
      canonical structured record as Markdown. Never provide state, answers, events, delivery, or timing; lifecycle and presentation policy are not extraction-controlled.
    merge_op: replace
