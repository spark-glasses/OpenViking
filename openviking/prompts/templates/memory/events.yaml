memory_type: events
description: |
  A coherent real-world occurrence or experience: a meeting, launch, trip,
  decision process or significant change. Preserve context, participants,
  decisions and outcome together when they describe the same occurrence.
  Search existing events first and extend the same event as evidence arrives.
  A new message, API page, recording chunk or status change is not by itself
  a new event. Separate independent occurrences; avoid lifelong topic buckets.
  Capture meaningful, supported experiences, not every sentence with a date.
  Occurrence time comes from original evidence; ingestion time is not event time.
  Unknown dates remain unknown. Put unresolved attribution or timing in questions.
directory: "viking://user/{{ user_space }}/memories/events"
filename_template: "{{ event_key }}.md"
enabled: true
operation_mode: upsert
embedding_template: "{{ summary }}\n{{ content }}"
overview_template: |-
  # Experiences and events
  {% for item in items %}
  - [{{ item.file_content.event_name|default(item.file_name, true) }}](./{{ item.file_name }})
  {% endfor %}
fields:
  - name: event_key
    type: string
    description: "Stable occurrence key, not a topic or message ID. Reuse the read event's key/URI. For new events use a distinguishing slug, including actual date only when known. Never use ingestion date to fill an unknown date."
    merge_op: immutable
  - name: event_name
    type: string
    description: "Readable name of this occurrence, e.g. Spark launch review."
    merge_op: replace
  - name: occurred_at
    type: string
    description: "Original occurrence time or range with timezone if known; empty if unknown. Preserve date precision and identify estimates in content."
    merge_op: replace
  - name: summary
    type: string
    description: "Supported context and outcome in a short summary, preserving decisions."
    merge_op: replace
  - name: content
    type: string
    description: "Cumulative Markdown: actual time/context, participants and roles, decisions, progress, outcome and evidence. Preserve dated changes rather than erasing history. Link canonical People, entities and relevant Focus URIs. Retain sourceRef plus version. Do not assert unconfirmed speaker identity or turn plans into completed events."
    merge_op: patch
