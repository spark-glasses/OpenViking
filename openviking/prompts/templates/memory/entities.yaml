memory_type: entities
description: |
  Persistent objects in the user's world: organizations, external projects,
  workspaces, places, products, works, programs and concepts. Store identity,
  purpose, current state and durable relations. Existence or message volume
  does not establish personal importance; that interpretation belongs in Focus.
  Search existing objects first. Reuse their URI across renames and sources;
  never merge on display name alone. Events describe what happened to objects,
  People describe participants, and Focus describes why the user cares.
  Existing application-owned contacts belong to their canonical people anchor,
  never a new entities person card. Resolve ambiguous names before person writes.
directory: "viking://user/{{ user_space }}/memories/entities"
filename_template: "{{ category }}/{{ name }}.md"
enabled: true
embedding_template: |-
  {{ category }}

  {{ name }}

  {{ content }}

overview_template: |-
  # Entities Overview
  {% if items %}**Category:** {{ items[0].file_content.category|default(directory_name, true) }}{% endif %}
  {% for item in items %}
  - [{{ item.file_content.name|default(item.file_name, true) }}](./{{ item.file_name }})
  {% endfor %}

fields:
  - name: category
    type: string
    description: |
      Category written in {{ language }}.
      {% if language == 'en' %}Use lowercase with underscores, max 3 words.{% else %}Keep it concise and natural in {{ language }}.{% endif %}
    merge_op: immutable

  - name: name
    type: string
    description: |
      Stable path key. Reuse it even when display name changes; put the current
      display name in the Markdown title. For external objects prefer a key
      scoped by provider/workspace/object ID when these have actually been read.
      Never invent external IDs or treat identical names as identity confirmation.
    merge_op: immutable

  - name: content
    type: string
    description: |
      Compact Markdown card for a third-party entity.

      Required shape: one H1 display name, then one plain sentence on the next line; 
      it must not start with "-", "*", or "1.". 
      Then 2-4 H2 sections, every H2 body must be a bullet list, 1-5 bullets per section; 
      do not write paragraph bodies under H2. Pick natural headings
      such as Description, Purpose, Role, Significance, Values, or Relations.

      Include compact but answerable entity facts. Prefer stable facts, but preserve
      exact user-stated facts that may be asked later: identity, origin, relationship
      or family status, counts, roles, skills, hobbies, favorite works/artists,
      important possessions, and notable dated facts tied to this entity.

      Preserve provider, workspace, external object identity, sourceRef and
      sourceVersion when supplied. Link canonical People, events and Focus URIs.
      Uncertain meaning and identity belong in questions. Do not drop exact names,
      counts, dates, places, titles, family relations, or recurring hobbies just to
      generalize. Keep one-off facts only when they are concrete and likely useful
      for future who/what/when/where/how-long questions.

      Keep it readable: usually 6-14 bullets total / about 1200 chars. When updating,
      merge and deduplicate; preserve existing atomic facts unless contradicted.
    merge_op: patch
