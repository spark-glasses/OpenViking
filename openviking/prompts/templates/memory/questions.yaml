memory_type: questions
description: |
  Durable unresolved knowledge with context and source evidence. Discover, add
  evidence, resolve from new sources, or mark obsolete. Asking is separate.
directory: "viking://user/{{ user_space }}/memories"
filename_template: "questions.md"
enabled: true
embedding_template: "{{ content }}"
fields:
  - name: subjectKind
    type: string
    merge_op: replace
  - name: subjectId
    type: string
    merge_op: replace
  - name: subjectMemoryUri
    type: string
    merge_op: replace
  - name: entries
    type: string
    description: "Typed question operations; generated by the shared question contract."
    merge_op: replace
