memory_type: profile
description: |
  # Task Objective
  Maintain the user's own anchor: one evolving profile that explains who the
  user is, what currently matters to them, and how they describe their life.
  Combine related information across conversations into a coherent document.
  Preserve useful specifics instead of reducing the user to a short biography
  or a personality label.

  # Scope
  - Basic information and background: names, residence, roles, affiliations,
    personal website and other user-provided identifiers, relationships, and
    meaningful education, work, or life transitions.
  - Current focus and goals: ongoing pursuits, concerns, constraints, and what
    the user is trying to achieve. Distinguish current priorities from enduring
    commitments and include the source date when available.
  - Values and priorities: what the user says matters to them, the tradeoffs
    they describe, and the reasons they give for important choices.
  - Self-description and personal narrative: how the user describes their
    personality, strengths, difficulties, and the meaning of life experiences.
    Attribute these accounts to the user rather than treating them as an
    objective psychological assessment.

  # Evidence
  - Record information stated or confirmed by the user. Assistant suggestions,
    questions, quoted third-party stories, and hypothetical examples are not
    facts about the user.
  - Preserve exact supported names, URLs, dates, and other useful details.
    Keep available source references and dates close to the relevant account;
    do not invent citations, dates, missing background, or causal explanations.
  - Describe personality frameworks or assessment results only when supplied
    or confirmed by the user, with their source and date when available.
    Do not infer a personality type, diagnosis, trauma, or hidden motivation.
  - Respect the user's established permission and exclusions for remembering
    trauma or similarly intimate experiences. General profile memory does not
    imply permission to retain every intimate detail. Do not solicit such
    details to fill out a profile, or store passwords or authentication secrets.

  # Updating
  - Read the existing profile and integrate new information into it. Preserve
    supported details from earlier conversations even when they are not
    mentioned again. Absence from the latest conversation is not a correction.
  - Merge repetition and update the relevant passage. Add detail when it
    changes or deepens the understanding of the user; return no change when
    the existing profile already captures it.
  - Honor explicit corrections and requests to remove details from this
    profile. Distinguish a corrected mistake from a real change in the user's
    life. For real changes, retain prior context when it explains their
    trajectory, clearly separating historical and current information.
  - If two accounts conflict without a clear correction, retain their
    attribution and timing rather than choosing an unsupported conclusion.
  - Keep the document readable with concise sections. Do not delete distinct
    useful information to meet a fixed bullet count or length target. Avoid
    raw transcript dumps, repeated evidence, and a log of every interaction.

  # Boundaries
  - Specific reusable tastes, habits, and workflow preferences belong in
    preferences. Broad values, life priorities, and self-narrative belong here;
    do not move them out merely to shorten the profile.
  - Include meaningful life transitions and ongoing concerns, but leave
    isolated appointments, one-off requests, temporary moods, and individual
    project updates in their relevant records unless the user connects them
    to an enduring concern or personal meaning.
  - This profile describes the user. Agent identity and behavior belong in
    identity and soul, not in the user's profile.

directory: "viking://user/{{ user_space }}/memories"
filename_template: "profile.md"
enabled: true
fields:
  - name: content
    type: string
    description: |
      A coherent Markdown profile of the user in their language. Organize known
      information into readable sections covering basic information and
      background, current focus and goals, values and priorities, and
      self-description and personal narrative. Omit empty sections instead of
      guessing content or inserting a questionnaire.

      Integrate updates into the existing document while preserving distinct,
      supported information and important life history. Keep exact personal
      identifiers such as a website URL when provided. Retain available source
      references and time context, and make user self-reports distinguishable
      from confirmed factual details. Follow the evidence, updating, and scope
      rules above; a newer conversation does not replace the whole user's story.
    merge_op: patch
