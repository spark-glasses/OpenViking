memory_type: focuses
description: |
  A user's sustained personal priority: a startup, education, health, relationships,
  or another thing they care about at any granularity. An external workspace or
  project is an entity, not automatically a Focus. Use listFocuses, reuse an existing
  identity and read it fully. ensureFocus creates an evidence-backed discovery in
  forming state; do not infer importance from message volume alone. A forming
  Focus is your draft. An active or archived one is the user's: its name and
  status are theirs to change, and an intent they stated is authoritative.
directory: "viking://user/{{ user_space }}/memories/focuses"
filename_template: "{{ focusId }}/memory.md"
enabled: true
operation_mode: upsert
embedding_template: "{{ name }}\n{{ intent }}\n{{ summary }}\n{{ content }}"
fields:
  - name: focusId
    type: string
    description: "Stable ID returned by listFocuses or ensureFocus. Never invent it."
    merge_op: immutable
  - name: name
    type: string
    description: "Human-readable name. Only a forming Focus may be renamed; leave empty otherwise. Empty means unchanged."
    merge_op: replace
  - name: intent
    type: string
    description: "Why this matters to the user. Leave empty when intentSource is user: the user said it themselves. Otherwise write your grounded understanding from the evidence, or improve an earlier guess; it is recorded as a guess."
    merge_op: replace
  - name: summary
    type: string
    description: "Up to 600 characters of grounded understanding useful on the Focus card. Keep what still holds, whether you or the user wrote it; revise or rewrite as the evidence requires."
    merge_op: replace
  - name: status
    type: string
    description: "Leave empty unless activating a sufficiently understood forming discovery as active. The lifecycle is forming / active / archived. Only the user archives or restores a Focus. Preserve user choices."
    merge_op: replace
  - name: content
    type: string
    description: "Cumulative Markdown: supported personal meaning, current concerns, tradeoffs and progress; link People/entities/events and exact source versions. Distinguish the user's intent from evidence-backed interpretation. Uncertain meaning belongs in questions. Do not copy every issue or message."
    merge_op: patch
